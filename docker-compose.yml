services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      WIND_CORS_ORIGINS: http://localhost
      WIND_DATA_PATH: data/processed/january_2026.csv
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
